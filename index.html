function showGps(){document.getElementById("gps").style.display="block"}function hideGps(){document.getElementById("gps").style.display="none"}
function setPos(lat,lng,acc){pos={lat:lat,lng:lng,acc:acc};var p=projected(lat,lng),r=Math.max(18,Math.min(95,(acc||15)/2));gpsLayer.innerHTML='<circle class="gpsAcc" cx="'+p.x+'" cy="'+p.y+'" r="'+r+'"/><circle class="gpsDot" cx="'+p.x+'" cy="'+p.y+'" r="14"/>';document.getElementById("status").textContent="GPS 已定位 · 精度約 ±"+Math.round(acc||0)+"m";document.getElementById("warn").style.display="none";hideGps();updateMeta()}
function gpsErr(){var w=document.getElementById("warn");w.style.display="block";w.textContent="⚠️ 無法取得定位。請允許瀏覽器的位置權限並開啟精確位置。";document.getElementById("status").textContent="GPS 尚未啟用";showGps()}
function startGps(){if(!window.isSecureContext||!navigator.geolocation){gpsErr();return}hideGps();if(watch!==null)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(function(p){setPos(p.coords.latitude,p.coords.longitude,p.coords.accuracy)},gpsErr,{enableHighAccuracy:true,maximumAge:1500,timeout:15000})}

function toMin(t){var a=t.split(":");return Number(a[0])*60+Number(a[1])}
var ttSelectedDay=(new Date().getDay()===0)?"sun":"sat";
function courseButton(item,idx,currentIdx){
 var cur=idx===currentIdx;
 return '<button class="classCard'+(cur?' current':'')+'" data-code="'+item[5]+'"><div class="classTime">'+item[0]+'–'+item[1]+'</div><div class="className">'+esc(item[2])+'</div><div class="classRoom">'+esc(item[3])+' · '+esc(item[4])+'</div>'+(cur?'<span class="nowBadge">現在</span>':'')+'</button>';
}
function bindCourseClicks(root){
 Array.prototype.forEach.call(root.querySelectorAll(".classCard"),function(btn){
  btn.onclick=function(){var p=data.find(function(x){return x.code===btn.dataset.code});if(p){select(p);if(pos)document.getElementById("route").click();}}
 });
}
function withinTerm(d){
 var y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate(),n=y*10000+m*100+day;
 return n>=20260913 && n<=20270116;
}
function updateTimetable(){
 var now=new Date(),dow=now.getDay(),mins=now.getHours()*60+now.getMinutes(),todayKey=dow===6?"sat":dow===0?"sun":null,current=-1,next=-1;
 if(todayKey&&withinTerm(now)){
  var arr=classSchedule[todayKey];
  for(var i=0;i<arr.length;i++){if(mins>=toMin(arr[i][0])&&mins<toMin(arr[i][1])){current=i;break}if(next<0&&mins<toMin(arr[i][0]))next=i}
 }
 if(todayKey)ttSelectedDay=todayKey;
 var list=document.getElementById("ttStrip"),shown=classSchedule[ttSelectedDay];
 list.innerHTML=shown.map(function(x,i){return courseButton(x,i,(ttSelectedDay===todayKey)?current:-1)}).join("");
 bindCourseClicks(list);
 var sat=document.getElementById("tabSat"),sun=document.getElementById("tabSun");
 sat.classList.toggle("active",ttSelectedDay==="sat");sun.classList.toggle("active",ttSelectedDay==="sun");
 sat.classList.toggle("today",dow===6);sun.classList.toggle("today",dow===0);
 var out=document.getElementById("ttNow");out.classList.remove("live");
 if(!withinTerm(now)){out.textContent="非上課期間";}
 else if(!todayKey){out.textContent="今天沒有排課";}
 else if(current>=0){var x=classSchedule[todayKey][current];out.textContent="現在："+x[2]+" · "+x[3];out.classList.add("live")}
 else if(next>=0){var n=classSchedule[todayKey][next];out.textContent="下一堂 "+n[0]+" "+n[2]+" · "+n[3]}
 else{out.textContent="今天課程已結束";}
}
document.getElementById("tabSat").onclick=function(){ttSelectedDay="sat";updateTimetable()};

})();
</script>
