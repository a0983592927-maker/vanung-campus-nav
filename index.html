<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#087a45">
<title>萬能校園導航</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--g:#087a45;--b:#1677ff;--t:#18212b;--muted:#667085;--card:rgba(255,255,255,.97);--shadow:0 8px 28px rgba(16,24,40,.16)}
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--t);background:#eef2f5;overflow:hidden}#map{position:absolute;inset:0}
.top{position:absolute;z-index:1000;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:8px;pointer-events:none}.logo,.search,.home{pointer-events:auto}.logo{width:48px;height:48px;border-radius:16px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:900;box-shadow:var(--shadow)}.search{height:48px;flex:1;background:#fff;border-radius:16px;display:flex;align-items:center;gap:8px;padding:0 12px;box-shadow:var(--shadow)}.search input{border:0;outline:0;background:transparent;width:100%;font-size:16px}.home{width:48px;height:48px;border:0;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-size:22px}
#results{display:none;position:absolute;z-index:1200;left:68px;right:68px;top:calc(env(safe-area-inset-top) + 66px);background:#fff;border-radius:14px;box-shadow:var(--shadow);max-height:42vh;overflow:auto}.res{padding:12px 14px;border-bottom:1px solid #eee}.res b{display:block}.res small{color:var(--muted)}
.fabs{position:absolute;z-index:1000;right:12px;bottom:214px;display:grid;gap:10px}.fab{width:52px;height:52px;border:0;border-radius:17px;background:#fff;box-shadow:var(--shadow);font-size:22px}.fab.on{color:var(--b);background:#edf4ff}
.sheet{position:absolute;z-index:1000;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:12px}.grab{width:40px;height:4px;background:#d9dde3;border-radius:99px;margin:0 auto 8px}.title{font-weight:900;font-size:18px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.quick{display:flex;gap:8px;overflow:auto;padding-top:10px}.chip{flex:0 0 auto;border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:9px 12px;font-size:14px}.chip.main{background:#e9f8ef;border-color:#bce8cd;color:#07663a;font-weight:800}
#place{display:none}.placeName{font-size:20px;font-weight:900}.meta{font-size:13px;color:var(--muted);margin:4px 0 10px}.row{display:flex;gap:8px}.btn{height:44px;border:0;border-radius:13px;font-size:15px;font-weight:800;flex:1}.back{background:#eef1f4}.go{background:var(--b);color:#fff}.nav{display:none;margin-top:9px;background:#edf5ff;border-radius:13px;padding:10px 12px;font-size:14px;line-height:1.45}
.gps,.warn{display:none;position:absolute;z-index:1250;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 72px);border-radius:15px;box-shadow:var(--shadow);padding:12px}.gps{background:#fff}.gps p{font-size:13px;color:var(--muted);margin:4px 0 10px}.gps button{width:100%;height:43px;border:0;border-radius:12px;background:var(--b);color:#fff;font-weight:900}.warn{background:#fff6e5;border:1px solid #ffd083;font-size:13px}
.codesBg{display:none;position:absolute;z-index:1300;inset:0;background:rgba(15,23,42,.28);backdrop-filter:blur(3px)}.codes{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:#fff;border-radius:24px;padding:14px;max-height:72vh;overflow:auto}.codeHead{display:flex;align-items:center}.codeHead b{font-size:20px;flex:1}.codeClose{width:38px;height:38px;border:0;border-radius:12px;font-size:22px}.hint{color:var(--muted);font-size:13px;margin:5px 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.code{min-height:58px;border:1px solid #dfe5ea;border-radius:15px;background:#fff;font-size:20px;font-weight:900;color:#17324a}.code small{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:9px!important}.lab{background:transparent;border:0}.lab div{background:rgba(255,255,255,.9);border:2px solid #147849;border-radius:12px;padding:2px 7px;color:#075c36;font-weight:900;white-space:nowrap;font-size:11px;box-shadow:0 2px 7px rgba(0,0,0,.1)}.codeTxt{font-size:10px;margin-right:4px}.dot{width:22px;height:22px;border-radius:50%;background:#1677ff;border:4px solid #fff;box-shadow:0 0 0 8px rgba(22,119,255,.18),0 2px 8px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="app">
<div id="map"></div>
<div class="top"><div class="logo">萬</div><div class="search"><span>🔎</span><input id="q" placeholder="搜尋大樓、英文棟號、餐廳…"></div><button class="home" id="home">🏫</button></div>
<div id="results"></div>
<div class="gps" id="gps"><b>開啟我的位置</b><p>允許定位後會顯示你的藍色位置點，走動時會跟著更新。</p><button id="allow">允許 GPS 定位</button></div>
<div class="warn" id="warn"></div>
<div class="fabs"><button class="fab" id="loc">◎</button><button class="fab on" id="follow">➤</button></div>
<div class="codesBg" id="codesBg"><div class="codes"><div class="grab"></div><div class="codeHead"><b>英文棟號</b><button class="codeClose" id="closeCodes">×</button></div><div class="hint">課表寫哪個英文代號，直接按一下就跳到那棟。</div><div class="grid" id="grid"></div></div></div>
<div class="sheet"><div id="start"><div class="grab"></div><div class="title">萬能校園導航</div><div class="sub" id="status">尚未取得 GPS 定位</div><div class="quick"><button class="chip main" id="codesBtn">🔤 英文棟號</button><button class="chip" data-find="中山堂">S 中山堂</button><button class="chip" data-find="弘道館">E 弘道館</button><button class="chip" data-find="行政大樓">RA 行政大樓</button><button class="chip" data-find="圖書資訊館">M 圖書館</button><button class="chip" data-find="餐飲大樓">J 餐飲大樓</button></div></div><div id="place"><div class="grab"></div><div class="placeName" id="pname"></div><div class="meta" id="meta"></div><div class="row"><button class="btn back" id="back">返回</button><button class="btn go" id="route">開始導航</button></div><div class="nav" id="nav"></div></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
var CENTER=[24.99085,121.23315];
var BOUNDS=L.latLngBounds([24.9880,121.2297],[24.9931,121.2362]);
var blocks=[
["RHD","新能源大樓",24.99243,121.23175,.00018,.00048,"#dce99b","教學/研究",["新能源","萬能學苑"]],
["H","遠東樓",24.99178,121.23028,.00028,.00034,"#e6d9ea","教學大樓",["遠東","經國樓"]],
["I","萬能樓",24.99178,121.23114,.00040,.00042,"#d7d0e6","教學大樓",["萬能樓"]],
["B","B棟",24.99077,121.23108,.00076,.00034,"#dcd4e8","教學大樓",["B棟"]],
["M","圖書資訊館",24.99095,121.23035,.00046,.00038,"#d9ec9a","圖書館",["存廬紀念圖書資訊館","圖書館"]],
["E","弘道館",24.99025,121.23008,.00042,.00030,"#eadf90","教學大樓",["弘道館"]],
["D","設計大樓",24.98998,121.23048,.00062,.00016,"#ebd0c0","教學大樓",["設計","工教大樓"]],
["RA","工業管理大樓",24.99063,121.23152,.00042,.00036,"#88c237","教學/行政",["工管","行政大樓"]],
["A","航空大樓",24.99062,121.23204,.00044,.00026,"#efe39f","教學大樓",["航空大樓","妝品大樓"]],
["J","餐飲大樓／萬芳樓",24.99175,121.23252,.00034,.00028,"#e2d7eb","餐飲/教學",["餐飲大樓","萬芳樓","育英樓"]],
["F","景觀餐廳",24.99173,121.23302,.00028,.00020,"#efe9b2","餐飲",["景觀餐廳","愚民館"]],
["S","中山堂／活動中心",24.99171,121.23356,.00034,.00022,"#f3ec9d","活動中心",["中山堂","活動中心","新世紀資訊大樓"]],
["T","航空暨旅館大樓",24.99174,121.23414,.00034,.00030,"#e6ec9a","教學大樓",["航空旅館","旅館大樓","萬全教學大樓"]],
["RHE","資訊大樓",24.99169,121.23480,.00064,.00036,"#dae988","教學/研究",["資訊大樓","信義樓"]],
["G","觀餐大樓",24.99070,121.23272,.00060,.00034,"#e9c8be","教學大樓",["觀餐","管理大樓"]],
["N","電資館",24.99002,121.23318,.00034,.00022,"#8dc83b","研究/實驗",["電資館","車輛育管保養廠"]],
["RHB","創意設計大樓",24.99002,121.23424,.00048,.00034,"#dce79e","教學大樓",["創意設計","仁愛樓"]],
["L","育才樓",24.99000,121.23495,.00046,.00026,"#d8d0e7","教學大樓",["育才樓"]],
["K","化工與材料工程館",24.98998,121.23355,.00024,.00054,"#f5db37","研究/實驗",["化工","材料工程館"]],
["V","萬能會館",24.98995,121.23545,.00044,.00030,"#efe39f","宿舍/餐飲",["萬能會館","宿舍餐廳"]],
["PH","運動休閒園區",24.99126,121.23568,.00056,.00050,"#e3d5e6","運動休閒",["運動休閒","羽球","游泳池"]],
["RHA","宿舍",24.98874,121.23114,.00064,.00028,"#dce79c","宿舍",["宿舍","忠孝樓"]],
["K02","航空暨工程館",24.98867,121.23034,.00064,.00030,"#ebe192","研究/實驗",["航空維修訓練中心","實習工廠"]]
];
var pois=[
{name:"北校門",lat:24.99245,lng:121.23318,type:"校門",aliases:["北門"]},
{name:"南校門",lat:24.98905,lng:121.23178,type:"校門",aliases:["南門"]},
{name:"便利商店",lat:24.98975,lng:121.23132,type:"生活服務",aliases:["超商","商店"]},
{name:"萬能站",lat:24.98873,lng:121.23205,type:"交通",aliases:["公車站","巴士"]},
{name:"運動場",lat:24.99025,lng:121.23555,type:"運動休閒",aliases:["操場","田徑場"]}
];
var places=[];
blocks.forEach(function(b){places.push({code:b[0],name:b[1],lat:b[2],lng:b[3],h:b[4],w:b[5],fill:b[6],type:b[7],aliases:b[8],kind:"block"});});
pois.forEach(function(p){p.kind="poi";places.push(p);});
var map=L.map("map",{zoomControl:false}).setView(CENTER,18);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,attribution:"&copy; OpenStreetMap"}).addTo(map);
L.rectangle(BOUNDS,{color:"#0b8f53",weight:2,fillOpacity:.03,dashArray:"6,6"}).addTo(map);
function label(html){return L.divIcon({className:"lab",html:"<div>"+html+"</div>",iconSize:null});}
function point(p){return [p.lat,p.lng];}
function disp(p){return p.code?p.code+" "+p.name:p.name;}
function title(p){return p.code?p.name+" "+p.code:p.name;}
places.forEach(function(p){
 if(p.kind==="block"){
   L.rectangle([[p.lat-p.h/2,p.lng-p.w/2],[p.lat+p.h/2,p.lng+p.w/2]],{color:"#6f7f6f",weight:1.2,fillColor:p.fill,fillOpacity:.75}).addTo(map).on("click",function(){select(p,true);});
   L.marker(point(p),{icon:label('<span class="codeTxt">'+p.code+"</span>"+p.name)}).addTo(map).on("click",function(){select(p,true);});
 }else{
   L.marker(point(p),{icon:label(p.name)}).addTo(map).on("click",function(){select(p,true);});
 }
});
var selected=null,line=null,pos=null,marker=null,accuracy=null,follow=true,watch=null;
function norm(s){return (s||"").toLowerCase().replace(/\s+/g,"");}
function match(p,s){var n=norm(s);return norm(disp(p)).indexOf(n)>=0||norm(p.name).indexOf(n)>=0||norm(p.code||"").indexOf(n)>=0||(p.aliases||[]).some(function(a){return norm(a).indexOf(n)>=0;});}
function dist(a,b){var R=6371000,r=Math.PI/180,dla=(b[0]-a[0])*r,dlo=(b[1]-a[1])*r,la1=a[0]*r,la2=b[0]*r,h=Math.sin(dla/2)*Math.sin(dla/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)*Math.sin(dlo/2);return 2*R*Math.asin(Math.sqrt(h));}
function updateMeta(){if(!selected)return;var a=pos?[pos.lat,pos.lng]:CENTER,d=dist(a,point(selected));document.getElementById("meta").textContent=selected.type+" · 約 "+Math.round(d)+" 公尺 · 步行約 "+Math.max(1,Math.ceil(d/75))+" 分鐘";}
function select(p,z){selected=p;document.getElementById("start").style.display="none";document.getElementById("place").style.display="block";document.getElementById("pname").textContent=title(p);document.getElementById("nav").style.display="none";updateMeta();if(z)map.setView(point(p),19,{animate:true});}
document.getElementById("back").onclick=function(){selected=null;document.getElementById("place").style.display="none";document.getElementById("start").style.display="block";if(line){map.removeLayer(line);line=null;}};
document.getElementById("route").onclick=function(){if(!selected)return;var a=pos?[pos.lat,pos.lng]:CENTER,b=point(selected);if(line)map.removeLayer(line);line=L.polyline([a,b],{color:"#1677ff",weight:7,opacity:.88}).addTo(map);map.fitBounds(line.getBounds().pad(.35));var d=dist(a,b),n=document.getElementById("nav");n.style.display="block";n.innerHTML="🚶 前往 <b>"+title(selected)+"</b>　約 <b>"+Math.round(d)+" m</b>／<b>"+Math.max(1,Math.ceil(d/75))+" 分鐘</b><br><span style='color:#667085'>藍線目前為校內直線導引；請依道路與建築出入口行走。</span>";};
var q=document.getElementById("q"),results=document.getElementById("results");
q.oninput=function(){var s=q.value.trim();if(!s){results.style.display="none";return;}var f=places.filter(function(p){return match(p,s);}).slice(0,8);results.innerHTML=f.length?f.map(function(p,i){return '<div class="res" data-i="'+i+'"><b>'+disp(p)+'</b><small>'+p.type+'</small></div>';}).join(""):'<div class="res">找不到校內地點</div>';results.style.display="block";Array.prototype.forEach.call(results.querySelectorAll("[data-i]"),function(el){el.onclick=function(){select(f[Number(el.getAttribute("data-i"))],true);results.style.display="none";q.blur();};});};
document.querySelectorAll("[data-find]").forEach(function(b){b.onclick=function(){var p=places.find(function(x){return match(x,b.getAttribute("data-find"));});if(p)select(p,true);};});
var order=["A","B","D","E","F","G","H","I","J","K","L","M","N","PH","RA","RHA","RHB","RHD","RHE","S","T","V","K02"],grid=document.getElementById("grid");
grid.innerHTML=order.map(function(c){var p=places.find(function(x){return x.code===c;});return p?'<button class="code" data-code="'+c+'">'+c+"<small>"+p.name+"</small></button>":"";}).join("");
grid.querySelectorAll("[data-code]").forEach(function(b){b.onclick=function(){var p=places.find(function(x){return x.code===b.getAttribute("data-code");});document.getElementById("codesBg").style.display="none";select(p,true);};});
document.getElementById("codesBtn").onclick=function(){document.getElementById("codesBg").style.display="block";};
document.getElementById("closeCodes").onclick=function(){document.getElementById("codesBg").style.display="none";};
document.getElementById("home").onclick=function(){follow=false;document.getElementById("follow").classList.remove("on");map.fitBounds(BOUNDS,{padding:[25,25]});};
function showGps(){document.getElementById("gps").style.display="block";}function hideGps(){document.getElementById("gps").style.display="none";}
function setPos(lat,lng,acc){pos={lat:lat,lng:lng};var ll=[lat,lng];if(!marker){marker=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="dot"></div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:9999}).addTo(map);accuracy=L.circle(ll,{radius:acc||15,color:"#1677ff",weight:1,fillColor:"#1677ff",fillOpacity:.08}).addTo(map);}else{marker.setLatLng(ll);accuracy.setLatLng(ll).setRadius(acc||15);}document.getElementById("status").textContent="GPS 已定位 · 精度約 ±"+Math.round(acc||0)+"m";document.getElementById("warn").style.display="none";hideGps();if(follow)map.setView(ll,19,{animate:true});updateMeta();}
function gpsErr(){var w=document.getElementById("warn");w.style.display="block";w.textContent="⚠️ 無法取得定位。請允許瀏覽器的位置權限，並開啟精確位置。";document.getElementById("status").textContent="GPS 尚未啟用";showGps();}
function startGps(){if(!window.isSecureContext){var w=document.getElementById("warn");w.style.display="block";w.textContent="⚠️ 必須使用 HTTPS 才能啟用 GPS。";return;}if(!navigator.geolocation){gpsErr();return;}hideGps();if(watch!==null)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(function(p){setPos(p.coords.latitude,p.coords.longitude,p.coords.accuracy);},gpsErr,{enableHighAccuracy:true,maximumAge:1500,timeout:15000});}
document.getElementById("allow").onclick=startGps;
document.getElementById("loc").onclick=function(){follow=true;document.getElementById("follow").classList.add("on");if(pos)map.setView([pos.lat,pos.lng],19);else startGps();};
document.getElementById("follow").onclick=function(){follow=!follow;this.classList.toggle("on",follow);if(follow&&pos)map.setView([pos.lat,pos.lng],19);};
map.on("dragstart",function(){follow=false;document.getElementById("follow").classList.remove("on");});
map.fitBounds(BOUNDS,{padding:[20,20]});
if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:"geolocation"}).then(function(r){if(r.state==="granted")startGps();else showGps();r.onchange=function(){if(r.state==="granted")startGps();};}).catch(showGps);}else showGps();
})();
</script>
</body>
</html>
